name: Build Eaglercraft 1.12.2 u2

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Make scripts executable
        working-directory: "Eaglercraft 1.12.2 u2 Source Code"
        run: |
          chmod +x CompileEPK.sh
          chmod +x CompileJS.sh
          chmod +x gradlew

      - name: Compile assets
        working-directory: "Eaglercraft 1.12.2 u2 Source Code"
        run: ./CompileEPK.sh

      - name: Compile JavaScript
        working-directory: "Eaglercraft 1.12.2 u2 Source Code"
        run: ./CompileJS.sh

      - name: Upload compiled JavaScript
        uses: actions/upload-artifact@v4
        with:
          name: eaglercraft-u2-javascript
          path: "Eaglercraft 1.12.2 u2 Source Code/javascript"
